name: KTools Release Pipeline

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: false

    - name: Download and Extract eac3to Decoders
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path bin/eac3to_decoders
        Invoke-WebRequest -Uri "https://github.com/krnzhnr/k-tools/releases/download/deps-v1/eac3to_decoders.tar.xz" -OutFile "eac3to_decoders.tar.xz"
        tar -xf eac3to_decoders.tar.xz -C bin/eac3to_decoders
        Remove-Item "eac3to_decoders.tar.xz"

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Determine Version and Release Info
      id: prep
      shell: python
      run: |
        import re, os

        ref = os.environ.get("GITHUB_REF", "")
        run_num = os.environ.get("GITHUB_RUN_NUMBER", "0")
        changelog = open("CHANGELOG.md", "r", encoding="utf-8").read()

        # Проверяем, является ли запуск релизным тегом (например, refs/tags/v2.0.0)
        is_tag = ref.startswith("refs/tags/v")

        if is_tag:
            tag_name = ref.replace("refs/tags/", "")
            clean_version = tag_name.lstrip("v")
            is_prerelease = False
            release_tag = tag_name
            release_name = f"KTools v{clean_version}"
        else:
            # Сборка для develop/main пре-релиза
            match_base = re.search(r"^#\s*(\d+\.\d+\.\d+)", changelog, re.MULTILINE)
            base_ver = match_base.group(1) if match_base else "2.0.0"
            clean_version = f"{base_ver}-preview.{run_num}"
            is_prerelease = True
            release_tag = "pre-release"
            release_name = f"KTools Pre-Release v{clean_version}"

        print(f"Version: {clean_version}, Tag: {release_tag}, Prerelease: {is_prerelease}")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"version={clean_version}\n")
            f.write(f"is_prerelease={'true' if is_prerelease else 'false'}\n")
            f.write(f"release_tag={release_tag}\n")
            f.write(f"release_name={release_name}\n")

        # Извлечение заметок об изменениях из CHANGELOG.md
        match_full = re.search(r"^#\s*([\d\.\-\w]+)", changelog, re.MULTILINE)
        if match_full:
            header = match_full.group(0)
            start_idx = changelog.find(header) + len(header)
            next_match = re.search(r"^#\s+[^#]", changelog[start_idx:], re.MULTILINE)
            notes = changelog[start_idx : start_idx + next_match.start()].strip() if next_match else changelog[start_idx:].strip()
            open("release_notes.md", "w", encoding="utf-8").write(notes)
        else:
            open("release_notes.md", "w", encoding="utf-8").write("Автоматическая сборка KTools.")

    - name: Install Inno Setup
      run: |
        choco install innosetup

    - name: Run Unit Tests
      run: |
        dotnet test KTools.App.Tests/KTools.App.Tests.csproj -c Release -p:Platform=x64 --no-restore

    - name: Build C# App and Installer
      env:
        BUILD_VERSION: ${{ steps.prep.outputs.version }}
      run: |
        python build_csharp.py

    - name: Delete Old Pre-Release Tag (if Prerelease)
      if: steps.prep.outputs.is_prerelease == 'true'
      shell: bash
      run: |
        gh release delete pre-release --cleanup-tag --yes || true
        gh release delete csharp-pre-release --cleanup-tag --yes || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.prep.outputs.release_tag }}
        name: ${{ steps.prep.outputs.release_name }}
        body_path: release_notes.md
        prerelease: ${{ steps.prep.outputs.is_prerelease == 'true' }}
        make_latest: ${{ steps.prep.outputs.is_prerelease == 'false' }}
        files: setup_output/KTools_*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
