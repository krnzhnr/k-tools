name: Build K-Tools C# Release

on:
  push:
    branches:
      - feature/csharp-migration
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-csharp:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: false

    - name: Download and Extract eac3to Decoders
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path bin/eac3to_decoders
        Invoke-WebRequest -Uri "https://github.com/krnzhnr/k-tools/releases/download/deps-v1/eac3to_decoders.tar.xz" -OutFile "eac3to_decoders.tar.xz"
        tar -xf eac3to_decoders.tar.xz -C bin/eac3to_decoders
        Remove-Item "eac3to_decoders.tar.xz"

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Extract Changelog Notes
      id: extract_notes
      shell: python
      run: |
        import re, os
        changelog = open("CHANGELOG.md", "r", encoding="utf-8").read()
        
        # Находим базовую версию X.Y.Z из верхнего заголовка CHANGELOG.md (например, 2.0.0 из # 2.0.0-csharp-dev)
        match_base = re.search(r"^#\s*(\d+\.\d+\.\d+)", changelog, re.MULTILINE)
        match_full = re.search(r"^#\s*([\d\.\-\w]+)", changelog, re.MULTILINE)
        
        run_number = os.environ.get("GITHUB_RUN_NUMBER", "0")
        
        if match_base:
            base_version = match_base.group(1)
            version = f"{base_version}-preview.{run_number}"
        elif match_full:
            version = f"{match_full.group(1)}-preview.{run_number}"
        else:
            version = f"2.0.0-preview.{run_number}"
            
        print(f"Generated build version: {version}")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"version={version}\n")
            
        # Заметки для релиза вычленяем с использованием полного верхнего заголовка
        if match_full:
            header = match_full.group(0)
            start_idx = changelog.find(header) + len(header)
            next_match = re.search(r"^#\s+[^#]", changelog[start_idx:], re.MULTILINE)
            notes = changelog[start_idx : start_idx + next_match.start()].strip() if next_match else changelog[start_idx:].strip()
            open("release_notes.md", "w", encoding="utf-8").write(notes)
        else:
            open("release_notes.md", "w", encoding="utf-8").write("Автоматическая сборка предварительной версии C#.")

    - name: Install Inno Setup
      run: |
        choco install innosetup

    - name: Build C# App and Installer
      env:
        BUILD_VERSION: ${{ steps.extract_notes.outputs.version }}
      run: |
        python src-python/build_csharp.py

    - name: Delete Old Pre-Release
      shell: bash
      run: |
        gh release delete csharp-pre-release --cleanup-tag --yes || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: csharp-pre-release
        name: "K-Tools C# Edition v${{ steps.extract_notes.outputs.version }}"
        body_path: release_notes.md
        prerelease: true
        make_latest: false
        files: setup_output/K-Tools_*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
