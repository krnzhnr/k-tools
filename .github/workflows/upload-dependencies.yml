name: Upload Dependencies to GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - 'bin/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-deps:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Create Tar.XZ Archives
      shell: pwsh
      run: |
        # Создаем папку для архивов
        New-Item -ItemType Directory -Force -Path temp_archives
        
        # Функция для архивации папки в tar.xz (сжатие LZMA2)
        function Archive-Folder([string]$srcDir, [string]$archiveName) {
            $srcPath = Join-Path "bin" $srcDir
            if (Test-Path $srcPath) {
                Write-Host "Архивация папки $srcPath в temp_archives/$archiveName"
                # Используем tar для создания tar.xz архива с переходом в исходную директорию
                # чтобы файлы располагались в корне архива
                tar -cJf "temp_archives/$archiveName" -C $srcPath .
            } else {
                Write-Host "Предупреждение: Папка $srcPath не найдена"
            }
        }

        Archive-Folder "ffmpeg" "ffmpeg.tar.xz"
        Archive-Folder "mkvtoolnix" "mkvtoolnix.tar.xz"
        Archive-Folder "eac3to" "eac3to.tar.xz"
        Archive-Folder "DEE" "dee.tar.xz"
        Archive-Folder "eac3to_decoders" "eac3to_decoders.tar.xz"

    - name: Create or Update Release deps-v1
      uses: softprops/action-gh-release@v2
      with:
        tag_name: deps-v1
        name: "K-Tools External Dependencies"
        body: "Автоматически упакованные и загруженные бинарные зависимости из Git LFS."
        prerelease: false
        make_latest: false
        files: temp_archives/*.tar.xz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
