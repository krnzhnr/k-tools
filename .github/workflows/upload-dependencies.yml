name: Upload Dependencies to GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - 'bin/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-deps:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Create Tar.XZ Archives
      shell: pwsh
      run: |
        # Создаем папку для архивов
        New-Item -ItemType Directory -Force -Path temp_archives
        
        # Функция для архивации папки в tar.xz (сжатие LZMA2)
        function Archive-Folder([string]$srcDir, [string]$archiveName) {
            $srcPath = Join-Path "bin" $srcDir
            if (Test-Path $srcPath) {
                Write-Host "Архивация папки $srcPath в temp_archives/$archiveName"
                # Используем tar для создания tar.xz архива с переходом в исходную директорию
                # чтобы файлы располагались в корне архива
                tar -cJf "temp_archives/$archiveName" -C $srcPath .
            } else {
                Write-Host "Предупреждение: Папка $srcPath не найдена"
            }
        }

        Archive-Folder "ffmpeg" "ffmpeg.tar.xz"
        Archive-Folder "mkvtoolnix" "mkvtoolnix.tar.xz"
        Archive-Folder "eac3to" "eac3to.tar.xz"
        Archive-Folder "DEE" "dee.tar.xz"
        Archive-Folder "eac3to_decoders" "eac3to_decoders.tar.xz"

    - name: Detect Binary Versions
      id: detect_versions
      shell: pwsh
      run: |
        function Get-ExeVersion([string]$exePath, [string]$arg) {
            if (-not (Test-Path $exePath)) { return "N/A" }
            try {
                $pinfo = New-Object System.Diagnostics.ProcessStartInfo
                $pinfo.FileName = (Resolve-Path $exePath).Path
                $pinfo.Arguments = $arg
                $pinfo.RedirectStandardOutput = $true
                $pinfo.RedirectStandardError = $true
                $pinfo.UseShellExecute = $false
                $pinfo.CreateNoWindow = $true

                $p = [System.Diagnostics.Process]::Start($pinfo)
                $out = $p.StandardOutput.ReadLine()
                if ([string]::IsNullOrWhiteSpace($out)) {
                    $out = $p.StandardError.ReadLine()
                }
                $p.WaitForExit(3000)

                if ($out -match 'v?(\d+\.\d+(\.\d+)?)') {
                    return $Matches[1]
                }
                return $out
            } catch {
                return "Unknown"
            }
        }

        $ffmpegVer = Get-ExeVersion "bin/ffmpeg/kt-ffmpeg.exe" "-version"
        $mkvVer    = Get-ExeVersion "bin/mkvtoolnix/mkvmerge.exe" "-V"
        $eacVer    = Get-ExeVersion "bin/eac3to/eac3to.exe" ""
        $qaacVer   = Get-ExeVersion "bin/ffmpeg/qaac64.exe" ""

        Write-Host "Detected versions: FFmpeg=$ffmpegVer, MKVToolNix=$mkvVer, eac3to=$eacVer, QAAC=$qaacVer"

        $jsonMap = @{
            "ffmpeg" = $ffmpegVer
            "mkvtoolnix" = $mkvVer
            "eac3to" = $eacVer
            "qaac" = $qaacVer
        } | ConvertTo-Json -Compress

        $bodyText = @"
Автоматически упакованные и загруженные бинарные зависимости из Git LFS.

```json:versions
$jsonMap
```
"@
        # Записываем в output step или env
        $bodyText | Out-File -FilePath release_body.txt -Encoding utf8

    - name: Create or Update Release deps-v1
      uses: softprops/action-gh-release@v2
      with:
        tag_name: deps-v1
        name: "K-Tools External Dependencies"
        body_path: release_body.txt
        prerelease: false
        make_latest: false
        files: temp_archives/*.tar.xz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
