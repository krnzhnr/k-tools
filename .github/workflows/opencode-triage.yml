name: opencode-triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'deepseek-v4.1-flash' }}
          prompt: |
            Ты ревьюер ишью в репозитории k-tools — утилиты для Windows (C#) по работе с видео/аудио: пересадка дорожек, извлечение, тайминги, сабы.
            Прочитай ишью и ответь СТРОГО в формате:
            **Порядок** (перечисли только то, что реально есть: ярлык, шаги воспроизведения, фактическое поведение, ожидаемое поведение, версия/сборка, описание задачи)
            **Не хватает** (чего нет из списка выше; для ишью типа «улучшение» шаги воспроизведения НЕ требуй — вместо них проверяй, понятно ли ЧТО нужно и ЗАЧЕМ)
            **Вопросы** (1–3 конкретных вопроса по существу задачи, а не общие фразы; если вопросов нет — напиши «Вопросов нет»)
            Правила: пиши по-русски, коротко, Markdown. Не упоминай имён людей. Не используй инструменты, не пиши файлы — только текст ответа. Если оформление полное и вопросов нет — так и напиши.
