name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode-go/muse-spark-1.3-contributor' }}
          prompt: |
            Сделай код-ревью этого PR (репозиторий k-tools — утилиты для Windows на C# для работы с видео/аудио).
            Ответь СТРОГО в формате:
            **Что хорошо** (1–3 пункта, только если реально есть)
            **Замечания** (конкретные: файл/строки, в чём проблема, как исправить; воды не лей; если замечаний нет — напиши «Замечаний нет»)
            **Вердикт** (одна строка: «Можно мержить» / «Нужны правки» / «Нужен человек» + почему)
            Правила: пиши по-русски, коротко, Markdown. Не упоминай имён людей. Не вноси изменения в код — только текст ревью.
