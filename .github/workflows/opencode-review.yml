name: PR review (opencode)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install opencode
        run: npm install -g --allow-scripts=@opencode/cli @opencode/cli
      - name: Verify opencode
        run: opencode --version
      - name: Review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
          MODEL: ${{ vars.OPENCODE_MODEL }}
          FALLBACK_MODEL: ${{ vars.OPENCODE_FALLBACK_MODEL }}
        run: node .github/scripts/agent.cjs review
        timeout-minutes: 15
