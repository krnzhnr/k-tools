name: opencode-retriage

on:
  issue_comment:
    types: [created]

jobs:
  retriage:
    if: >-
      ${{ github.event.sender.type != 'Bot' &&
        github.event.issue.state == 'open' &&
        (contains(github.event.comment.body, '/retriage') ||
          contains(github.event.comment.body, '/recheck')) &&
        !contains(github.event.comment.body, '/oc') &&
        !contains(github.event.comment.body, '/opencode') }}
    runs-on: ubuntu-latest
    concurrency:
      group: retriage-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          prompt: |
            Тебя вызвали командой `/retriage` (алиас `/recheck`) в комментарии к ишью репозитория k-tools — утилиты для Windows (C#) по работе с видео/аудио: пересадка дорожек, извлечение, тайминги, сабы. Сделай ПОВТОРНОЕ ревью.
            У тебя ЕСТЬ инструменты — используй `gh` CLI для действий, а не только текст. Контекст (номер ишью, URL) возьми из события GitHub; прочитай ишью и ВСЮ ветку комментариев целиком, включая команду вызова.
            Шаг 1 — сверка: что из прошлого ревью (разделы «Не хватает» / «Вопросы») автор уже закрыл, а что осталось. Для ишью типа «улучшение» шаги воспроизведения НЕ требуй — проверяй, понятно ли ЧТО нужно и ЗАЧЕМ.
            Шаг 2 — действия через `gh` (каждую команду выполняй с `|| true`, чтобы нехватка прав не роняла весь шаг):
            - Ярлыки — добавляй недостающие (`--add-label`), только точные имена из списка: баг, улучшение, документация, вопрос, дубликат, отклонено, рефакторинг, эпик, неактуально, отложено, производительность.
              Пример: `gh issue edit <номер> --add-label "баг" || true`. Снимать ярлыки (`--remove-label`) и ставить вердикты дубликат / отклонено / неактуально / отложено сам НЕ должен — неверные ярлыки и вердикты только предложи в тексте.
            - Исполнитель — если стало понятно, что это баг или внятное улучшение, а исполнитель пуст: `gh issue edit <номер> --add-assignee krnzhnr || true`.
              Других людей не назначай никогда; уже назначенного не снимай.
            - Проект K-Tools (owner krnzhnr, проект №2): уточни поля по именам `gh project item-edit 2 --owner krnzhnr --url <url-ишью> --field "<Поле>" --value "<Значение>" || true`,
              если раньше они стояли неверно или пусто. Тип (`--field "Тип"`): Баг / Улучшение / Новая функция / Задача / Вопрос.
              Приоритет (`--field "Приоритет"`): Высокий — падение или потеря данных, Средний — по умолчанию, Низкий — мелочь.
              Область (`--field "Область"`): Скрипты / Очередь и выполнение / Зависимости и окружение / Настройки и интерфейс / Система и уведомления; если неясно — пропусти.
              Статус не трогай, если он уже не пуст; значения Готово / Архив ставить ЗАПРЕЩЕНО. Если проектных прав нет — пропусти и дай рекомендации строкой в комментарии.
            - Закрывать ишью — ЗАПРЕЩЕНО.
            Шаг 3 — оставь один комментарий СТРОГО в формате:
            **Проверка** (что добавилось с прошлого раза — по пунктам)
            **Осталось** (что ещё не хватает; если оформление полное и вопросов нет — так и напиши)
            **Действия** (что реально изменил: ярлыки, исполнитель, поля проекта; что не смог из-за прав — почему и что рекомендуешь)
            Правила: пиши по-русски, коротко, Markdown. Не упоминай имён людей. Один вызов — один комментарий, дублей не пиши. Команды /oc и /opencode не обрабатывай — их берёт on-demand workflow.
